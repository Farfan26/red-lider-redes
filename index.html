<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Líder | Síguenos en nuestras redes</title>
  <link rel="icon" href="assets/favicon-lider.png" type="image/png">

  <!-- Importación de tipografías oficiales de Google Fonts (Poppins e Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <!-- Enlace a la hoja de estilos principal -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Contenedor principal que centra y limita el ancho del contenido -->
  <div class="wrap">

    <!-- Zona superior del logotipo corporativo -->
    <div class="logo-zone">
      <div class="logo-glow">
        <img src="assets/logo.png" alt="Red Líder - Espacios para crecer">
      </div>
    </div>

    <!-- Títulos y subtítulos principales de la página -->
    <h1 class="headline">¡Síguenos en nuestras redes sociales!</h1>
    <p class="subline">Estrategias comerciales, liderazgo, casos de éxito y próximos eventos: todo el contenido que
      impulsa el crecimiento de tu empresa, todos los días.</p>

    <!-- Sección principal: Las tarjetas se centran automáticamente aquí -->
    <div class="hero">
      <!-- Columna donde se insertan dinámicamente las tarjetas de redes sociales desde JavaScript -->
      <div class="cards-col" id="cards-col">
        <!-- Las tarjetas se generan de forma automática en el script.js -->
      </div>
    </div>

    <!-- Pie de página corporativo -->
    <div class="footer">
      <strong>© 2026 Red Líder</strong> Espacios para crecer. Todos los derechos reservados.
    </div>

  </div>

  <!-- Enlace al archivo JavaScript que genera las tarjetas interactivas -->
  <script src="script.js"></script>

</body>

</html>
